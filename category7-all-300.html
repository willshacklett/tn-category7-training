<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tennessee Category 7 — 300-Question Pre-Class Study</title><style>:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}body{margin:0;background:#0b1423;color:#e8f0ff}main{max-width:950px;margin:auto;padding:28px 16px}a{color:#6ee7d4}header{border-bottom:1px solid #354b65;padding-bottom:16px}.muted{color:#b1c9e0}.panel{background:#17283e;border:1px solid #344d68;border-radius:16px;padding:22px;margin:20px 0}.choices{display:grid;gap:10px;margin:18px 0}.choice{display:block;padding:12px;border:1px solid #4b6380;border-radius:10px;cursor:pointer}.choice:has(input:checked){background:#164d5b;border-color:#50d1bf}button{border:0;border-radius:9px;background:#3acbab;color:#071b20;font-weight:800;padding:12px 18px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.feedback{border-left:4px solid #4de0b6;padding:12px 14px;margin:14px 0;background:#24344a}.wrong{border-color:#f1a178}.stats{font-size:1.1rem;font-weight:700}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:.9rem}#review article{padding:12px 0;border-bottom:1px solid #40536a}.secondary{background:#314760;color:#e8f0ff}.secondary:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}</style></head><body><main><header><a href="index.html">← Training Center</a><h1>Tennessee Category 7 — 300-Question Pre-Class Study</h1><p class="muted">Standalone pre-class study. Select an answer to see immediate feedback and an explanation. No classroom materials required.</p></header><section id="quiz" class="panel"><div id="progress" class="stats" aria-live="polite"></div><h2 id="question"></h2><div id="choices" class="choices"></div><div id="feedback" aria-live="polite"></div><div class="toolbar"><button id="next" disabled>Next Question</button><button id="reset-progress" type="button" class="secondary">Start over</button></div><p id="save-status" class="muted small" role="status" aria-live="polite"></p></section><section id="results" class="panel hidden"><h2>Study complete</h2><p id="score" class="stats"></p><h3>Review missed questions</h3><div id="review"></div><button id="restart">Start again</button></section></main><script src="questions-batch-01.js"></script><script>window.C7_BATCH_1=window.C7_QUESTIONS;</script><script src="questions-batch-02.js"></script><script>window.C7_BATCH_2=window.C7_QUESTIONS;</script><script src="questions-batch-03.js"></script><script>window.C7_BATCH_3=window.C7_QUESTIONS;</script><script src="questions-batch-04.js"></script><script>window.C7_BATCH_4=window.C7_QUESTIONS;</script><script src="questions-batch-05.js"></script><script>window.C7_BATCH_5=window.C7_QUESTIONS;</script><script src="questions-batch-06.js"></script><script>window.C7_BATCH_6=window.C7_QUESTIONS;</script><script>window.C7_ALL_QUESTIONS=[].concat(...[1,2,3,4,5,6].map(i=>window[`C7_BATCH_${i}`]));</script><script>
(()=>{'use strict';
const qs=window.C7_ALL_QUESTIONS;
const el=id=>document.getElementById(id);
const progress=el('progress'),question=el('question'),choices=el('choices'),feedback=el('feedback');
const next=el('next'),review=el('review'),status=el('save-status');
const STORAGE_KEY='tn-category7-training.study.v1';
const fingerprint=qs.map(q=>q.id).join('|');
let at=0,score=0,locked=false,missed=[],answers=[];
let storageAvailable=true;
try{localStorage.setItem(STORAGE_KEY+'.probe','1');localStorage.removeItem(STORAGE_KEY+'.probe')}catch(_){storageAvailable=false}
function save(){
 if(!storageAvailable)return;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,fingerprint,answers}))}
 catch(_){storageAvailable=false;status.textContent='Progress saving unavailable in this browser.'}
}
function restore(){
 if(!storageAvailable)return;
 try{
  const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;
  const data=JSON.parse(raw);
  if(data.version!==1||data.fingerprint!==fingerprint||!Array.isArray(data.answers))return;
  const parsed=[];
  for(let i=0;i<Math.min(data.answers.length,qs.length);i++){
   const a=data.answers[i];if(!Number.isInteger(a)||a<0||a>=qs[i].options.length)break;
   parsed.push(a)
  }
  answers=parsed;
  score=answers.reduce((n,a,i)=>n+(a===qs[i].answer?1:0),0);
  missed=answers.flatMap((a,i)=>a===qs[i].answer?[]:[{n:i+1,q:qs[i]}]);
  at=answers.length===qs.length?qs.length-1:answers.length;
 }catch(_){/* Corrupt local data: safely restart. */}
}
function showFeedback(q,pick){
 const good=pick===q.answer;
 const box=document.createElement('div');box.className='feedback'+(good?'':' wrong');
 box.textContent=(good?'Correct. ':'Not quite. ')+`Correct answer: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}. `+q.explanation;
 feedback.replaceChildren(box);choices.querySelectorAll('input').forEach(x=>x.disabled=true);next.disabled=false;
}
function render(){
 locked=at<answers.length;
 const q=qs[at];progress.textContent=`Question ${at+1} of ${qs.length} • ${score} correct so far`;
 question.textContent=q.question;choices.replaceChildren();feedback.replaceChildren();next.disabled=true;
 next.textContent=at===qs.length-1?'Finish study':'Next Question';
 q.options.forEach((o,i)=>{
  const label=document.createElement('label');label.className='choice';const input=document.createElement('input');
  input.type='radio';input.name='answer';input.value=String(i);
  if(locked){input.checked=answers[at]===i;input.disabled=true}
  input.addEventListener('change',()=>{
   if(locked)return;
   locked=true;const good=i===q.answer;if(good)score++;else missed.push({n:at+1,q});
   answers.push(i);save();showFeedback(q,i);
   status.textContent=storageAvailable?'Progress saved automatically on this device.':'Progress saving unavailable in this browser.';
  });
  label.append(input,document.createTextNode(' '+String.fromCharCode(65+i)+'. '+o));choices.append(label)
 });
 if(locked)showFeedback(q,answers[at]);
 status.textContent=storageAvailable?'Progress is saved on this device after every answer.':'Progress saving unavailable in this browser.';
}
function finish(){
 el('quiz').classList.add('hidden');el('results').classList.remove('hidden');
 const percentage=score===qs.length?'100':(100*score/qs.length).toFixed(1);
 el('score').textContent=`${score} / ${qs.length} correct (${percentage}%)`;
 review.replaceChildren();
 missed.forEach(({n,q})=>{
  const article=document.createElement('article'),heading=document.createElement('strong'),detail=document.createElement('p');
  heading.textContent=`Question ${n}: ${q.question}`;
  detail.textContent=`Correct answer: ${q.options[q.answer]}. ${q.explanation}`;
  article.append(heading,detail);review.append(article)
 });
 if(!missed.length)review.textContent='All questions answered correctly!';
 window.scrollTo(0,0)
}
function reset(){
 if(!window.confirm('Start over? This will erase your saved answers and score on this device.'))return;
 if(storageAvailable)try{localStorage.removeItem(STORAGE_KEY)}catch(_){}
 answers=[];score=0;missed=[];at=0;locked=false;
 el('results').classList.add('hidden');el('quiz').classList.remove('hidden');render();window.scrollTo(0,0)
}
next.addEventListener('click',()=>{
 if(!locked)return;
 if(at<qs.length-1){at++;render();window.scrollTo(0,0)}else finish()
});
el('reset-progress').addEventListener('click',reset);
el('restart').addEventListener('click',reset);
restore();render();
})();
</script></body></html>
