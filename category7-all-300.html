<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tennessee Category 7 — 300-Question Pre-Class Study</title><style>:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}body{margin:0;background:#0b1423;color:#e8f0ff}main{max-width:950px;margin:auto;padding:28px 16px}a{color:#6ee7d4}header{border-bottom:1px solid #354b65;padding-bottom:16px}.muted{color:#b1c9e0}.panel{background:#17283e;border:1px solid #344d68;border-radius:16px;padding:22px;margin:20px 0}.choices{display:grid;gap:10px;margin:18px 0}.choice{display:block;padding:12px;border:1px solid #4b6380;border-radius:10px;cursor:pointer}.choice:has(input:checked){background:#164d5b;border-color:#50d1bf}button{border:0;border-radius:9px;background:#3acbab;color:#071b20;font-weight:800;padding:12px 18px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.feedback{border-left:4px solid #4de0b6;padding:12px 14px;margin:14px 0;background:#24344a}.wrong{border-color:#f1a178}.stats{font-size:1.1rem;font-weight:700}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:.9rem}#review article{padding:12px 0;border-bottom:1px solid #40536a}</style></head><body><main><header><a href="index.html">← Training Center</a><h1>Tennessee Category 7 — 300-Question Pre-Class Study</h1><p class="muted">Standalone pre-class study. Select an answer to see immediate feedback and an explanation. No classroom materials required.</p></header><section id="quiz" class="panel"><div id="progress" class="stats" aria-live="polite"></div><h2 id="question"></h2><div id="choices" class="choices"></div><div id="feedback" aria-live="polite"></div><button id="next" disabled>Next Question</button></section><section id="results" class="panel hidden"><h2>Study complete</h2><p id="score" class="stats"></p><h3>Review missed questions</h3><div id="review"></div><button id="restart">Start again</button></section></main><script src="questions-batch-01.js"></script><script>window.C7_BATCH_1=window.C7_QUESTIONS;</script><script src="questions-batch-02.js"></script><script>window.C7_BATCH_2=window.C7_QUESTIONS;</script><script src="questions-batch-03.js"></script><script>window.C7_BATCH_3=window.C7_QUESTIONS;</script><script src="questions-batch-04.js"></script><script>window.C7_BATCH_4=window.C7_QUESTIONS;</script><script src="questions-batch-05.js"></script><script>window.C7_BATCH_5=window.C7_QUESTIONS;</script><script src="questions-batch-06.js"></script><script>window.C7_BATCH_6=window.C7_QUESTIONS;</script><script>window.C7_ALL_QUESTIONS=[].concat(...[1,2,3,4,5,6].map(i=>window[`C7_BATCH_${i}`]));</script><script> (()=>{'use strict';const qs=window.C7_ALL_QUESTIONS;let at=0,score=0,locked=false,missed=[];const el=id=>document.getElementById(id),progress=el('progress'),question=el('question'),choices=el('choices'),feedback=el('feedback'),next=el('next'),review=el('review');function render(){locked=false;let q=qs[at];progress.textContent=`Question ${at+1} of ${qs.length} • ${score} correct so far`;question.textContent=q.question;choices.replaceChildren();feedback.replaceChildren();next.disabled=true;next.textContent=at===qs.length-1?'Finish study':'Next Question';q.options.forEach((o,i)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name='answer';input.addEventListener('change',()=>{if(locked)return;locked=true;const good=i===q.answer;if(good)score++;else missed.push({n:at+1,q});choices.querySelectorAll('input').forEach(x=>x.disabled=true);const box=document.createElement('div');box.className='feedback'+(good?'':' wrong');box.textContent=(good?'Correct. ':'Not quite. ')+`Correct answer: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}. `+q.explanation;feedback.append(box);next.disabled=false;});label.append(input,document.createTextNode(' '+String.fromCharCode(65+i)+'. '+o));choices.append(label)})}next.addEventListener('click',()=>{if(!locked)return;if(at<qs.length-1){at++;render();window.scrollTo(0,0)}else{el('quiz').classList.add('hidden');el('results').classList.remove('hidden');el('score').textContent=`${score} / ${qs.length} correct (${Math.round(score/qs.length*100)}%)`;review.replaceChildren();missed.forEach(({n,q})=>{const a=document.createElement('article');const h=document.createElement('strong');h.textContent=`Question ${n}: ${q.question}`;const p=document.createElement('p');p.textContent=`Correct answer: ${q.options[q.answer]}. ${q.explanation}`;a.append(h,p);review.append(a)}) ;if(!missed.length)review.textContent='All questions answered correctly!';window.scrollTo(0,0)}});el('restart').onclick=()=>location.reload();render()})();</script></body></html>
