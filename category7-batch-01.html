<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category 7 — First 50 Practice Questions</title><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}body{margin:0;background:#0b1423;color:#e8f0ff}main{max-width:900px;margin:auto;padding:28px 16px}a{color:#6ee7d4}header{border-bottom:1px solid #354b65;margin-bottom:22px;padding-bottom:16px}.muted{color:#b1c9e0}.panel{background:#17283e;border:1px solid #344d68;border-radius:16px;padding:22px;margin:20px 0}.choices{display:grid;gap:10px;margin:18px 0}.choice{display:block;padding:12px;border:1px solid #4b6380;border-radius:10px;cursor:pointer}.choice:has(input:checked){background:#164d5b;border-color:#50d1bf}button{border:0;border-radius:9px;background:#3acbab;color:#071b20;font-weight:800;padding:12px 18px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}nav{display:flex;gap:12px;flex-wrap:wrap}.hidden{display:none}.feedback{border-left:4px solid #4de0b6;padding:10px 14px;margin:14px 0;background:#24344a}.wrong{border-color:#f1a178}.stats{font-size:1.1rem;font-weight:700}.small{font-size:.9rem}</style></head>
<body><main><header><a href="index.html">← Training Center</a><h1>Tennessee Category 7 — Batch 1</h1><p class="muted">50 original questions grounded in the training presentation. This is a review draft, not the completed 300-question bank or a state exam.</p></header>
<section id="quiz" class="panel">
  <div id="progress" class="stats" aria-live="polite"></div>
  <h2 id="question"></h2>
  <div id="options" class="choices"></div>
  <div id="feedback" aria-live="polite"></div>
  <p class="muted small" id="reference"></p>
  <nav><button id="next" type="button" disabled>Next Question</button></nav>
</section>
<section id="results" class="panel hidden">
  <h2>Practice complete</h2>
  <p class="stats" id="score"></p>
  <button id="toggle-review" type="button" aria-expanded="false">Review Missed Questions</button>
  <div id="review" class="hidden"></div>
  <button id="restart" type="button">Try again</button>
</section>
</main>
<script src="questions-batch-01.js"></script>
<script src="category7-study-mode.js"></script>
</body></html>
